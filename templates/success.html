<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success - Punji Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1>🐕 Punji Product Manager</h1>
            <a href="{{ url_for('logout') }}" class="btn-secondary">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="success-card">
            <div class="success-icon">✅</div>
            <h2>Product Added Successfully!</h2>
            <p><strong>{{ product_name }}</strong> has been added to your product catalog.</p>

            <div class="success-details">
                <p>The product data has been committed to your GitHub repository and will appear on your website
                    shortly.</p>
                <img src="{{ product_url }}" alt="{{ product_name }}" class="success-image">
            </div>

            <div class="success-actions">
                <a href="{{ url_for('admin') }}" class="btn-primary">Add Another Product</a>
            </div>
        </div>
    </div>
</body>

</html>
