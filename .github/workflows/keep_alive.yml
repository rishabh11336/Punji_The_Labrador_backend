name: Keep Render App Alive

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render apps
        run: |
          curl -fsS https://punji-the-labrador-backend.onrender.com/ > /dev/null || echo "Ping failed: punji-the-labrador-backend"