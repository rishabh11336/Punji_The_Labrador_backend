name: Keep Render App Alive

on:
  schedule:
    # Runs every 14 minutes (GitHub Actions may delay exact timing)
    # Note: GitHub doesn't guarantee precise timing for scheduled workflows
    # Minimum recommended interval is 15 minutes to avoid rate limiting
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render App
        run: |
          echo "Pinging Render app at $(date)"
          if curl -fsS --max-time 30 --retry 3 --retry-delay 5 https://punji-the-labrador-backend.onrender.com/ > /dev/null; then
            echo "✓ Ping successful"
          else
            echo "✗ Ping failed - keeping app alive attempt failed"
            exit 1
          fi